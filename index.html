<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aira - Friendly Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="bot-avatar">A</div>
            <div>
                <h1>Aira</h1>
                <p><span class="status-dot"></span> Ready to chat</p>
            </div>
            <button id="clear-btn" class="clear-button" type="button">
                Clear chat
            </button>
        </header>

        <section class="chat-messages" id="chat-messages"
                 aria-label="Chat messages" aria-live="polite">
        </section>

        <div class="suggestions">
            <p>Try asking:</p>
            <button type="button" class="suggestion"
                onclick="document.getElementById('user-input').value='How can I improve my English?'">
                English tips
            </button>
            <button type="button" class="suggestion"
                onclick="document.getElementById('user-input').value='What is Python?'">
                Python
            </button>
            <button type="button" class="suggestion"
                onclick="document.getElementById('user-input').value='Give me interview tips'">
                Interview tips
            </button>
        </div>

        <form id="chat-form" class="chat-form">
            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                autocomplete="off"
                aria-label="Your message"
                required
            >
            <button type="submit" id="send-btn">Send ↗</button>
        </form>

        <footer class="chat-footer">
            Aira uses predefined replies for common questions.
        </footer>
    </main>
</body>
</html>
